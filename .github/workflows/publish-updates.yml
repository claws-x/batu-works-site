name: Publish verified company updates
on:
  issues:
    types: [opened, edited, labeled]
  workflow_dispatch:
permissions:
  contents: write
  issues: read
concurrency:
  group: website-feed
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'issues' && github.event.issue.author_association == 'OWNER' && startsWith(github.event.issue.title, '[publish] ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate and publish verified announcement
        run: python3 scripts/publish_issue.py
      - name: Commit and push updated feed
        run: |
          if git diff --quiet -- updates.json; then
            echo "No feed changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates.json
          git commit -m "content(site): publish verified company update"
          git push
