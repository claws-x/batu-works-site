name: Deploy BATU WORKS website
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'privacy.html'
      - 'support.html'
      - 'updates.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fail closed on broken site content
        run: python3 scripts/check_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
